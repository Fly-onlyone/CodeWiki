name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a pull request cancels the run it replaces. Runs on main are
# never cancelled, so every commit there keeps a result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  # Both legs gate the build. The advisories leg can fail without any change
  # here, when a new advisory is published: fix the dependency, or add the ID
  # to `ignore` in deny.toml with a reason. fail-fast is off so that such a
  # failure does not cancel the other leg.
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans sources
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  # CodeWiki run on this repository, which also proves that the backend CLI
  # still compiles on Linux, as the Docker image needs. Its `check` reports
  # to code scanning and never fails the build. Its `update` does: the wiki
  # in `obsidian/` is committed, and it must be what this commit's code
  # generates.
  wiki-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
        with:
          # Hotspots, ownership and change coupling read the git history.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The findings go outside the checkout: a file written into it would be
      # one more file for the sync below to count.
      - run: cargo run --locked -p codewiki -- check --format sarif --fail-on never --output "${{ runner.temp }}/codewiki.sarif"
        env:
          # The index is a cache; it is built on first use in a scratch
          # folder. The runner context exists only at step level.
          CODEWIKI_DATA_DIR: ${{ runner.temp }}/codewiki
      # A pull request from a fork gets a read-only token and cannot upload.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ runner.temp }}/codewiki.sarif
          category: codewiki
      # A sync here may change nothing but the commit the manifest names.
      # Source files are hashed with CRLF read as LF, so the result does not
      # depend on the checkout. A failure means that code changed without
      # its `docs(wiki)` commit: run `cargo run -p codewiki -- update` at the
      # repository root, in a tree with no stray files, and commit
      # `obsidian/`. Dependabot cannot do that, so its pull requests are let
      # through, and the push to main that merges one is held to it.
      - name: The wiki is in sync with the code
        if: github.actor != 'dependabot[bot]'
        shell: bash
        env:
          CODEWIKI_DATA_DIR: ${{ runner.temp }}/codewiki
        run: |
          cargo run --locked -p codewiki -- update
          stale=0
          git diff --exit-code -I'"last_indexed_commit"' -- obsidian || stale=1
          added=$(git ls-files --others --exclude-standard -- obsidian)
          if [ -n "$added" ]; then
            echo "Notes the sync would add:"
            echo "$added"
            stale=1
          fi
          if [ "$stale" = 1 ]; then
            echo "::error::The wiki in obsidian/ is not what this commit's code generates. Run 'cargo run -p codewiki -- update' and commit obsidian/ as docs(wiki)."
            exit 1
          fi
