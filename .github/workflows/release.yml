name: Release

# A version tag (v0.2.0, v0.2.0-rc.1) builds the Windows package with
# scripts/package.ps1 and publishes it as a GitHub Release. The tag must match
# the workspace version in Cargo.toml. The programs carry the DSN of the
# repository variable SENTRY_DSN, and with the secret SENTRY_AUTH_TOKEN their
# debug files go to Sentry.
#
# A pull request that changes the packaging, and a manual run, build the same
# package as a dry run: it is kept as a workflow artifact and nothing is
# published. So does a push to main that changes the packaging.
#
# The package holds the zip (for self-update and installing by hand) and the
# setup program (the file to download), each with a .sha256 file.

on:
  push:
    # GitHub does not evaluate path filters for pushes of tags, so a tag
    # always runs.
    tags: ["v*"]
    branches: [main]
    paths:
      - scripts/package.ps1
      - scripts/install.ps1
      - scripts/uninstall.ps1
      - scripts/setup/**
      - .github/workflows/release.yml
  pull_request:
    paths:
      - scripts/package.ps1
      - scripts/install.ps1
      - scripts/uninstall.ps1
      - scripts/setup/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  package:
    runs-on: windows-latest
    # A release build of all three programs (thin LTO, one codegen unit) with
    # no cache to start from.
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable

      - name: Read the version
        id: version
        shell: pwsh
        env:
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          # Same pattern as scripts/package.ps1.
          $manifest = Get-Content Cargo.toml -Raw
          if ($manifest -notmatch '(?m)^version\s*=\s*"([^"]+)"') { throw "no workspace version in Cargo.toml" }
          $version = $Matches[1]
          if ($env:IS_TAG -eq 'true' -and "v$version" -ne $env:GITHUB_REF_NAME) {
            throw "tag $env:GITHUB_REF_NAME does not match the Cargo.toml version $version"
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "zip=dist/CodeWiki-$version-windows-x64.zip" >> $env:GITHUB_OUTPUT
          "setup=dist/CodeWiki-$version-windows-x64-setup.exe" >> $env:GITHUB_OUTPUT

      - name: Build and package
        shell: pwsh
        env:
          # The programs carry the DSN and report only once the user turns
          # error reports on. A repository without the variable builds
          # programs that never report.
          CODEWIKI_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SETUP: ${{ steps.version.outputs.setup }}
        run: |
          ./scripts/package.ps1
          # package.ps1 skips the setup program when it finds no Inno Setup
          # compiler. A release must not go out without it.
          $iscc = Get-Command ISCC.exe -ErrorAction SilentlyContinue
          if ($iscc) { "Inno Setup compiler: $($iscc.Source)" }
          if (-not (Test-Path $env:SETUP)) { throw "the setup program was not built: $env:SETUP" }

      - name: Write the checksums
        shell: pwsh
        env:
          ZIP: ${{ steps.version.outputs.zip }}
          SETUP: ${{ steps.version.outputs.setup }}
        run: |
          foreach ($file in $env:ZIP, $env:SETUP) {
            $hash = (Get-FileHash -Algorithm SHA256 $file).Hash.ToLowerInvariant()
            # LF, not CRLF: `sha256sum -c` reads a carriage return as part of the name.
            "$hash  $(Split-Path -Leaf $file)`n" | Set-Content -NoNewline -Encoding ascii "$file.sha256"
            Get-Content "$file.sha256"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: CodeWiki-${{ steps.version.outputs.version }}-windows-x64
          path: |
            ${{ steps.version.outputs.zip }}
            ${{ steps.version.outputs.zip }}.sha256
            ${{ steps.version.outputs.setup }}
            ${{ steps.version.outputs.setup }}.sha256
          if-no-files-found: error
          retention-days: 7

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          ZIP: ${{ steps.version.outputs.zip }}
          SETUP: ${{ steps.version.outputs.setup }}
        run: |
          $flags = @()
          # A version with a pre-release part (0.2.0-rc.1) is not the latest release.
          if ($env:VERSION.Contains('-')) { $flags += '--prerelease' }
          $notes = "**Download ``CodeWiki-$env:VERSION-windows-x64-setup.exe``** and double-click it. The zip is for self-update and for installing by hand."
          gh release create $env:GITHUB_REF_NAME $env:SETUP "$env:SETUP.sha256" $env:ZIP "$env:ZIP.sha256" `
            --title "CodeWiki $env:VERSION" --notes $notes --generate-notes --verify-tag @flags

      # A secret cannot be named in a step's condition, and the token must not
      # reach the build above, whose build scripts see its environment.
      - name: Look for a Sentry token
        id: sentry
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          "ready=$([bool]$env:SENTRY_AUTH_TOKEN)".ToLower() >> $env:GITHUB_OUTPUT

      # Sentry names the functions of a release build's stack trace from these
      # files (dist/symbols-<version>, written by package.ps1).
      - name: Send the debug files to Sentry
        if: steps.sentry.outputs.ready == 'true'
        shell: pwsh
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: fly-theonlyone
          SENTRY_PROJECT: codewiki
          RELEASE: codewiki@${{ steps.version.outputs.version }}
          SYMBOLS: dist/symbols-${{ steps.version.outputs.version }}
        run: |
          $cli = "@sentry/cli@3.8.2"
          npx --yes $cli releases new $env:RELEASE
          if ($LASTEXITCODE -ne 0) { throw "sentry-cli could not create the release" }
          npx --yes $cli debug-files upload --wait $env:SYMBOLS
          if ($LASTEXITCODE -ne 0) { throw "sentry-cli could not upload the debug files" }
          npx --yes $cli releases finalize $env:RELEASE
          if ($LASTEXITCODE -ne 0) { throw "sentry-cli could not finalize the release" }
