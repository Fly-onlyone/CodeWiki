[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes", "vendor"]

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Every `unsafe` block says why it is sound, in a `// SAFETY:` comment.
# CodeWiki's own `check` reports a block without one too.
undocumented_unsafe_blocks = "warn"

# Debug builds of this workspace grew past 40 GB. Most of that was debug
# information for dependencies (the UI kit above all) and the incremental
# cache. Dependencies are built without debug information, and our own crates
# keep only what a backtrace needs.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# gpui-base 0.9.1 with a hover look for links in a TextView (`LinkHoverStyle`),
# which the release lacks. The copy is the published crate with its tests and
# benches left out; NOTICE lists the files changed. Drop it, or copy the new
# release and patch it again, when gpui-kit is bumped. Asked of gpui-kit in
# https://github.com/longbridge/gpui-kit/issues/4116.
[patch.crates-io]
gpui-base = { path = "vendor/gpui-base" }
