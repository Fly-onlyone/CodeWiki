[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_code = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# Debug builds of this workspace grew past 40 GB. Most of that was debug
# information for dependencies (the UI kit above all) and the incremental
# cache. Dependencies are built without debug information, and our own crates
# keep only what a backtrace needs.
[profile.dev]
debug = "line-tables-only"
incremental = false

[profile.dev.package."*"]
debug = false

# The engine of the built-in embedding models is forty times slower without
# optimization (spike S5 in spikes/VERDICTS.md): a dev backend could not
# embed a repository. These are the crates its arithmetic runs in. Only their
# optimization changes; the debug settings above hold for them too.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f16]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
[profile.dev.package.gemm-f64]
opt-level = 3
[profile.dev.package.gemm-c32]
opt-level = 3
[profile.dev.package.gemm-c64]
opt-level = 3
[profile.dev.package.pulp]
opt-level = 3
[profile.dev.package.rayon]
opt-level = 3
[profile.dev.package.rayon-core]
opt-level = 3
[profile.dev.package.tokenizers]
opt-level = 3
[profile.dev.package.cw-embed-engine]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
