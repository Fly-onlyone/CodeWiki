[package]
name = "codewiki-mcp"
description = "MCP stdio bridge between coding agents and the CodeWiki backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cw-client = { version = "0.1.0", path = "../cw-client" }
cw-core = { path = "../cw-core" }
rmcp = { version = "3.9.0", features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
