[package]
name = "cw-core"
description = "Shared identifiers, hashing, configuration and error types for CodeWiki"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
hex = "0.4.3"
log = { version = "0.4", features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
thiserror = "2.0.21"

# The Data Protection API, which encrypts a saved secret for the current user
# (`secret.rs`).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Security_Cryptography"] }
