[package]
name = "cw-mermaid"
description = "Mermaid diagram rendering for CodeWiki"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Default features are off on purpose: they pull in the EPL-2.0 ELK layout.
merman = { version = "0.9.3", default-features = false, features = ["svg", "png", "diagram-flowchart", "diagram-sequence", "diagram-state"] }
