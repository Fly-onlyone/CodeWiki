[package]
name = "cw-mermaid"
description = "Mermaid diagram rendering for CodeWiki"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
# Default features are off on purpose: they pull in the EPL-2.0 ELK layout.
# Since 0.10 a PNG needs `system-fonts`: without it every raster render fails with
# "retained font catalog and host font-source policy have no usable source".
merman = { version = "0.10.0", default-features = false, features = ["svg", "png", "system-fonts", "diagram-flowchart", "diagram-sequence", "diagram-state"] }
