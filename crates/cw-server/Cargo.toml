[package]
name = "cw-server"
description = "HTTP API of the CodeWiki backend"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
axum = "0.8.9"
cw-core = { path = "../cw-core" }
cw-embed = { path = "../cw-embed" }
cw-index = { path = "../cw-index" }
cw-llm = { version = "0.2.0", path = "../cw-llm" }
cw-models = { version = "0.2.0", path = "../cw-models" }
cw-telemetry = { path = "../cw-telemetry" }
cw-vault = { path = "../cw-vault" }
cw-wiki = { path = "../cw-wiki" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync"] }

[dev-dependencies]
http-body-util = "0.1.5"
tempfile = "3"
tokio = { version = "1.54.1", features = ["time"] }
tower = { version = "0.5.3", features = ["util"] }
