[package]
name = "cw-wiki"
description = "Concept selection and wiki generation pipeline for CodeWiki"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
cw-embed = { version = "0.1.0", path = "../cw-embed" }
cw-core = { path = "../cw-core" }
cw-graph = { path = "../cw-graph" }
cw-illustrate = { version = "0.1.0", path = "../cw-illustrate" }
cw-index = { path = "../cw-index" }
cw-parse = { path = "../cw-parse" }
cw-vault = { path = "../cw-vault" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
cw-illustrate = { path = "../cw-illustrate" }
tempfile = "3"
