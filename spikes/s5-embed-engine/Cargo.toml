[package]
name = "spike-s5-embed-engine"
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace]

[features]
# Needs the CUDA toolkit (nvcc) at build time; gate B of the spike.
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]

[dependencies]
candle-core = "0.11.1"
candle-nn = "0.11.1"
candle-transformers = "0.11.1"
# The defaults build C (onig) and C++ (esaxx); these features are pure Rust.
tokenizers = { version = "0.23", default-features = false, features = ["fancy-regex"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.40"
nvml-wrapper = "0.13"
ureq = "3"
sha2 = "0.11"
hex = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_Shell",
    "Win32_System_Performance",
] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
